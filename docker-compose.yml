services:
  postgres:
    image: postgres:16-alpine
    container_name: steamhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: steamhub_user
      POSTGRES_PASSWORD: steamhub_secret_password
      POSTGRES_DB: steamhub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steamhub_user -d steamhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
